name: MediJoApp
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  MediJoApp:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MediJoApp
        DEVELOPMENT_TEAM: $(DEV_TEAM)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads mindfullness minutes."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Writes mindfulness minutes."
        SWIFT_VERSION: "6.0"
    entitlements:
      path: App/MediJo.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
